<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Відео-демо: трекінг людини з віртуальною поворотною камерою</title>
    <meta property="og:title" content="Відео-демо: трекінг людини з віртуальною поворотною камерою" />
    <meta property="og:image" content="media/demo-poster.jpg" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 16px;
        padding: 24px 16px; background: #0b0f14; color: #e6ecf5;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      h1 { margin: 0; font-size: 20px; font-weight: 650; text-align: center; }
      p { margin: 0; color: #8a97a8; font-size: 14px; text-align: center; max-width: 720px; line-height: 1.5; }
      video { width: 100%; max-width: 1100px; border-radius: 10px; border: 1px solid #1f2833; background: #000; }
      .links { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
      a { color: #04121a; background: #35d0ff; text-decoration: none; font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 8px; }
      a.ghost { color: #e6ecf5; background: transparent; border: 1px solid #2a3542; }
    </style>
  </head>
  <body>
    <h1>Трекінг людини з віртуальною поворотною камерою</h1>
    <p>Камера знаходить людину, регулятор PID повертає симульовану платформу pan/tilt так, щоб людина залишалася в центрі кадру. Усе працює в браузері.</p>
    <video src="media/demo.mp4" poster="media/demo-poster.jpg" controls playsinline preload="metadata"></video>
    <div class="links">
      <a href="./">Відкрити живе демо</a>
      <a class="ghost" href="https://github.com/qitech/person-tracking-gimbal">Код на GitHub</a>
    </div>
  </body>
</html>
